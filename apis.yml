name: Get
description: >-
  Get (useget.com) is a Singapore-based fintech company offering a mobile banking and
  financial-literacy platform for children, teens, and their families. The Get app pairs
  separate kid and parent accounts with prepaid Visa cards, parental spending controls,
  automated weekly allowances, a chore-based reward system, real-time spending analytics,
  and savings-goal folders, so young people can practice using real money tools in a safe,
  supervised environment. Get sells consumer subscription tiers (Get Core and Get Plus) plus
  a family account, and operates under a Payment Services exemption in Singapore. No public
  API, developer portal, or machine-readable specification is published at this time; this
  profile is maintained as a company record in the API Evangelist network.
